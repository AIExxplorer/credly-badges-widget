<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credly Badges</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }
        
        .badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        
        .badge:hover {
            transform: translateY(-5px);
        }
        
        .badge-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.05));
        }
        
        .badge:hover .badge-img {
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        
        .badge-name {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: #333;
            max-width: 120px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="badges" id="badges-container"></div>
    
    <script>
        // Fetch badges from JSON file
        fetch('./badges.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('badges-container');
                const badges = data.badges || [];
                
                if (badges.length === 0) {
                    container.innerHTML = '<p>Carregando badges...</p>';
                    return;
                }
                
                badges.forEach(badge => {
                    const link = document.createElement('a');
                    link.className = 'badge';
                    link.href = badge.url || 'https://www.credly.com/users/aiexxplorer/badges';
                    link.target = '_blank';
                    link.title = badge.name;
                    link.innerHTML = `<img src="${badge.image}" alt="${badge.name}" class="badge-img" onerror="this.src='https://via.placeholder.com/120'"><div class="badge-name">${badge.name}</div>`;
                    container.appendChild(link);
                });
            })
            .catch(error => {
                console.error('Error loading badges:', error);
                document.getElementById('badges-container').innerHTML = '<p>Erro ao carregar badges</p>';
            });
    </script>
</body>
</html>
