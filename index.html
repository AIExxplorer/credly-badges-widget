<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credly Badges Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }

        .badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .badge:hover {
            transform: translateY(-5px);
        }

        .badge-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
        }

        .badge:hover .badge-image {
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .badge-name {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: #333;
            max-width: 120px;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            font-size: 16px;
            color: #666;
        }

        .error {
            text-align: center;
            font-size: 16px;
            color: #d32f2f;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="badges-container" class="badges-container">
        <div class="loading">Carregando seus badges da Credly...</div>
    </div>

    <script>
        async function fetchCrewlyBadges() {
            const username = 'aiexxplorer';
            
            try {
                // Fetch do Credly usando o username
                const response = await fetch(
                    `https://www.credly.com/api/v2/users/${username}/professional_badges`,
                    {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        }
                    }
                );

                if (response.ok) {
                    const data = await response.json();
                    const badges = Array.isArray(data) ? data : (data.professional_badges || []);
                    renderBadges(badges);
                } else {
                    throw new Error('Failed to fetch from Credly API');
                }
            } catch (error) {
                console.error('Error fetching from Credly API:', error);
                // Fallback: tentar scraping via página HTML
                fetchCrewlyBadgesFromPage();
            }
        }

        async function fetchCrewlyBadgesFromPage() {
            try {
                // Fetch da página de perfil e extrai os badges
                const response = await fetch(
                    `https://www.credly.com/users/aiexxplorer`,
                    {
                        method: 'GET',
                        headers: {
                            'Accept': 'text/html'
                        }
                    }
                );

                if (response.ok) {
                    const html = await response.text();
                    // Extrair dados de badges do HTML
                    const badgeMatches = html.match(/"name":"([^"]*)","image_url":"([^"]*)"/g);
                    
                    if (badgeMatches && badgeMatches.length > 0) {
                        const badges = badgeMatches.map((match, index) => {
                            const nameMatch = match.match(/"name":"([^"]*)"/)[1];
                            const imageMatch = match.match(/"image_url":"([^"]*)"/)[1];
                            return {
                                name: nameMatch,
                                image_url: imageMatch
                            };
                        });
                        renderBadges(badges);
                    } else {
                        throw new Error('No badges found in page');
                    }
                } else {
                    throw new Error('Failed to fetch page');
                }
            } catch (error) {
                console.error('Error fetching from page:', error);
                // Último fallback: usar dados hardcoded
                renderBadgesFromHardcoded();
            }
        }

        function renderBadges(badges) {
            const container = document.getElementById('badges-container');
            container.innerHTML = '';

            if (!badges || badges.length === 0) {
                container.innerHTML = '<div class="error">Nenhum badge encontrado</div>';
                return;
            }

            badges.forEach((badge) => {
                const badgeElement = document.createElement('a');
                badgeElement.className = 'badge';
                badgeElement.href = `https://www.credly.com/users/aiexxplorer/badges`;
                badgeElement.target = '_blank';
                badgeElement.rel = 'noopener noreferrer';

                const imageUrl = badge.image_url || badge.image || '';
                const badgeName = badge.name || badge.badge_name || 'Badge';

                badgeElement.innerHTML = `
                    <img src="${imageUrl}" alt="${badgeName}" class="badge-image" onerror="this.style.display='none'">
                    <div class="badge-name">${badgeName}</div>
                `;

                container.appendChild(badgeElement);
            });
        }

        function renderBadgesFromHardcoded() {
            const fallbackBadges = [
                {
                    name: 'Foundational C# with Microsoft',
                    image_url: 'https://images.credly.com/size/680x680/images/a85c3da2-b8c3-4c75-8463-8c4d221dfdc9/image.png'
                },
                {
                    name: 'Google Cloud Digital Leader',
                    image_url: 'https://images.credly.com/size/680x680/images/75a937f8-2016-4c11-a72d-8e6b9ce0ebca/image.png'
                },
                {
                    name: 'Google Cloud Associate Cloud Engineer',
                    image_url: 'https://images.credly.com/size/680x680/images/0258b246-f22f-42ad-8c6f-c57d05828330/image.png'
                },
                {
                    name: 'CompTIA Security+',
                    image_url: 'https://images.credly.com/size/680x680/images/74827fe0-2dca-4167-a6d9-d7ce4b9b9249/image.png'
                },
                {
                    name: 'Professional Cloud Architect',
                    image_url: 'https://images.credly.com/size/680x680/images/08216781-93cb-4ba1-8110-8eb3f60e21d4/image.png'
                },
                {
                    name: 'Cloud Digital Leader',
                    image_url: 'https://images.credly.com/size/680x680/images/0e284c3f-5164-4b21-8660-0d8fb3c32bbd/image.png'
                }
            ];
            
            renderBadges(fallbackBadges);
        }

        // Load badges when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchCrewlyBadges);
        } else {
            fetchCrewlyBadges();
        }
    </script>
</body>
</html>
